<!--
  Hub de ferramentas — favicon da família.
  Regras e conferência: PADRAO-FAVICON.md (§3.1).

  Um nó central ligado a três: o hub aponta para as ferramentas, e é literalmente
  o que ele faz (§1 do INSTRUCOES.md).

  Neste projeto (Next, App Router) o arquivo vai em `app/icon.svg`, e o mesmo
  desenho vive também em `public/marca.svg`, que é o cabeçalho.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="8" fill="#1d4ed8" />
  <g stroke="#ffffff" stroke-width="2.8" stroke-linecap="round">
    <line x1="16" y1="16" x2="16" y2="8.5" />
    <line x1="16" y1="16" x2="22.6" y2="20" />
    <line x1="16" y1="16" x2="9.4" y2="20" />
  </g>
  <circle cx="16" cy="16" r="4.2" fill="#ffffff" />
  <circle cx="16" cy="7.6" r="3.3" fill="#ffffff" />
  <circle cx="23.3" cy="20.4" r="3.3" fill="#ffffff" />
  <circle cx="8.7" cy="20.4" r="3.3" fill="#ffffff" />
</svg>
